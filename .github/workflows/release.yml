name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'effect-kit/redis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      plan: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changesets
        uses: changesets/action/select-mode@v2

  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          pr-base-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}

  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      packed: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Reserve 0.0.0 for manual bootstrap
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/redis/package.json", "utf8"));
            if (version === "0.0.0") throw new Error("Publish the bootstrap version manually");
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:pull
      - run: pnpm verify
      - run: pnpm test:artifacts
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.plan.outputs.plan }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
      - run: pnpm release:check --pack-dir "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-candidate/verification.json
            packages/redis/test/results/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, prepare]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish verified tarballs with OIDC and provenance
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.prepare.outputs.packed }}
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_PUBLISH_WAIT_TIMEOUT: "600000"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.packed }}
          path: ${{ runner.temp }}/published-candidate
          merge-multiple: true
      - run: pnpm fixtures:pull --engine redis
      - run: pnpm fixtures:pull --engine valkey
      - run: pnpm release:smoke --pack-dir "$RUNNER_TEMP/published-candidate" --provenance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/published-candidate/registry-verification.json
          if-no-files-found: warn
          retention-days: 30
