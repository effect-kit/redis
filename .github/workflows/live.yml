name: Live conformance

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (blank tests the default branch)
        type: string
        default: ""
      suite:
        description: Live test suite
        type: choice
        options: [all, core, redis, valkey, dragonfly, keydb, redict, garnet, kvrocks]
        default: all

permissions:
  contents: read

jobs:
  request:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.request.outputs.run }}
      sha: ${{ steps.request.outputs.sha }}
      matrix: ${{ steps.request.outputs.matrix }}
      target: ${{ steps.request.outputs.target }}
      suite: ${{ steps.request.outputs.suite }}
    steps:
      # PR selection never changes the trusted controller's checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        id: request
        with:
          script: |
            const { liveMatrix, pullNumber, verifiedSha } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/live-request.mjs`);
            const suite = context.payload.inputs.suite;
            const pr = context.payload.inputs.pr ? pullNumber(context.payload.inputs.pr) : undefined;
            let sha = context.sha;
            if (pr !== undefined) {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr });
              if (data.state !== 'open') throw new Error('PR must be open');
              sha = data.head.sha;
            } else {
              const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: context.payload.repository.default_branch });
              sha = data.commit.sha;
            }
            core.setOutput('target', pr === undefined ? `run-${context.runId}` : `pr-${pr}`);
            core.setOutput('suite', suite);
            core.setOutput('sha', verifiedSha(sha));
            core.setOutput('matrix', JSON.stringify(liveMatrix(suite)));
            core.setOutput('run', 'true');
            core.summary.addHeading('Live test request').addRaw(`Commit: ${verifiedSha(sha)}; suite: ${suite}`).write();

  live:
    needs: request
    if: needs.request.outputs.run == 'true'
    name: Live (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: live-${{ needs.request.outputs.target }}-${{ matrix.suite }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.request.outputs.matrix) }}
    env:
      EFFECT_REDIS_TEST_ENGINE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false
      - name: Verify requested commit
        env:
          REQUESTED_SHA: ${{ needs.request.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: ./.github/actions/setup
      - run: pnpm fixtures:pull
        if: matrix.suite != 'core'
      - run: pnpm test:live
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-${{ matrix.suite }}-${{ needs.request.outputs.sha }}
          path: packages/redis/test/results/
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [request, live]
    if: always() && needs.request.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@v9
        env:
          TEST_SHA: ${{ needs.request.outputs.sha }}
          TEST_SUITE: ${{ needs.request.outputs.suite }}
          TEST_RESULT: ${{ needs.live.result }}
        with:
          script: |
            const conclusion = { success: 'success', failure: 'failure', cancelled: 'cancelled', skipped: 'neutral' }[process.env.TEST_RESULT] || 'failure';
            await github.rest.checks.create({ ...context.repo, head_sha: process.env.TEST_SHA,
              name: `Live conformance (${process.env.TEST_SUITE})`, status: 'completed', conclusion,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: { title: `Live tests: ${conclusion}`, summary: `Exact commit: ${process.env.TEST_SHA}. See individual matrix jobs and artifacts for engine results.` } });
