name: Release hardening

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  hardening:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:pull --engine redis
      - run: pnpm fixtures:pull --engine valkey
      - run: pnpm test:hardening
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-hardening-${{ github.run_id }}
          path: packages/redis/test/results/hardening/
          if-no-files-found: error
          retention-days: 14
