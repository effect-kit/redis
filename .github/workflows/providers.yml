name: Hosted providers

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Authorized isolated free-service selection
        type: choice
        default: all
        options: [all, upstash-native, upstash-http, aiven, redis-cloud-free, workers]
      runtime:
        description: Host runtime (Workers is independently selected)
        type: choice
        default: all
        options: [all, node, bun, deno]

permissions:
  contents: read

# The test Worker is a single owned deployment: never overlap replacement/restoration runs.
concurrency:
  group: hosted-provider-certification
  cancel-in-progress: false

jobs:
  providers:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: effect-kit/.github/actions/setup@v1
      - if: inputs.runtime == 'all' || inputs.runtime == 'deno'
        run: pnpm providers:prepare
      - run: pnpm test:providers --env --provider "$PROVIDER_SELECTION" --runtime "$RUNTIME_SELECTION"
        env:
          PROVIDER_SELECTION: ${{ inputs.provider || 'all' }}
          RUNTIME_SELECTION: ${{ inputs.runtime || 'all' }}
          EFFECT_REDIS_TEST_UPSTASH_REST_URL: ${{ secrets.EFFECT_REDIS_TEST_UPSTASH_REST_URL }}
          EFFECT_REDIS_TEST_UPSTASH_REST_TOKEN: ${{ secrets.EFFECT_REDIS_TEST_UPSTASH_REST_TOKEN }}
          EFFECT_REDIS_TEST_UPSTASH_REDIS_URL: ${{ secrets.EFFECT_REDIS_TEST_UPSTASH_REDIS_URL }}
          EFFECT_REDIS_TEST_AIVEN_URL: ${{ secrets.EFFECT_REDIS_TEST_AIVEN_URL }}
          EFFECT_REDIS_TEST_REDIS_CLOUD_URL: ${{ secrets.EFFECT_REDIS_TEST_REDIS_CLOUD_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EFFECT_REDIS_TEST_WORKER_NAME: ${{ secrets.EFFECT_REDIS_TEST_WORKER_NAME }}
          EFFECT_REDIS_TEST_WORKER_URL: ${{ secrets.EFFECT_REDIS_TEST_WORKER_URL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-provider-evidence-${{ github.run_id }}
          path: packages/redis/test/results/providers/
          if-no-files-found: error
          retention-days: 14
