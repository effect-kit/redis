name: Release smoke

on:
  workflow_dispatch:
    inputs:
      release-run-id:
        description: Successful Release run ID
        type: number
        required: true
      pack-artifact-id:
        description: Packed artifact ID from that release job summary
        type: number
        required: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    uses: effect-kit/.github/.github/workflows/release-smoke.yml@v1
    with:
      release-run-id: ${{ inputs.release-run-id }}
      pack-artifact-id: ${{ inputs.pack-artifact-id }}
      bun: true
