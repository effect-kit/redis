name: Workspace setup
description: Install pinned runtimes and workspace dependencies after checkout

inputs:
  bun:
    description: Install the runtime pinned in .bun-version
    default: "true"
  cache:
    description: Package-manager cache to enable (pnpm or empty)
    default: ""
  ignore-scripts:
    description: Disable dependency lifecycle scripts
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      if: inputs.bun == 'true'
      with:
        bun-version-file: .bun-version
        no-cache: true
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile${{ inputs.ignore-scripts == 'true' && ' --ignore-scripts' || '' }}
